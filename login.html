<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaCart | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="./assets/js/main.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center px-4">
  <main class="w-full max-w-md bg-white p-8 rounded-2xl shadow-md">
    <a href="index.html" class="text-indigo-600 font-semibold">← Back to Home</a>
    <h1 class="text-3xl font-bold mt-4">Welcome Back</h1>
    <p class="text-slate-500 mt-1">Login to continue shopping.</p>

    <form id="login-form" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-medium">Email</label>
        <input id="email" type="email" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="you@example.com" />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input id="password" type="password" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold">Login</button>
    </form>
  </main>
</body>
</html>
